<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>__PROJECT_TITLE__</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      #pano { position: absolute; inset: 0; z-index: 0; }
      #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #111; color: #fff; z-index: 10; transition: opacity 0.4s; }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .spinner { width: 48px; height: 48px; border: 3px solid #444; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading-text { font-size: 14px; color: #aaa; }
      /* 缩略图导航条 */
      #thumb-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 8px; padding: 8px; background: rgba(0,0,0,0.5); border-radius: 10px; backdrop-filter: blur(8px); max-width: 90vw; overflow-x: auto; }
      .thumb { width: 80px; height: 50px; border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; flex-shrink: 0; background-size: cover; background-position: center; background-color: #222; }
      .thumb.active { border-color: #4dabf7; }
      .thumb span { display: block; text-align: center; color: #fff; font-size: 10px; background: rgba(0,0,0,0.6); padding: 2px; }
      /* 错误提示 */
      #error { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #ff6b6b; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px; display: none; z-index: 20; max-width: 80vw; text-align: center; }
      /* 自动旋转提示 */
      #auto-rotate-btn { position: absolute; top: 20px; right: 20px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.5); border: none; color: #fff; cursor: pointer; backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background 0.2s; }
      #auto-rotate-btn:hover { background: rgba(0,0,0,0.7); }
      #auto-rotate-btn.active { background: rgba(77, 171, 247, 0.7); }
      /* 场景标题 */
      #scene-title { position: absolute; top: 20px; left: 20px; z-index: 5; color: #fff; font-size: 16px; background: rgba(0,0,0,0.5); padding: 8px 14px; border-radius: 6px; backdrop-filter: blur(8px); }
      /* 隐藏 stats 面板（编辑器中才需要） */
      .stats { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="pano"></div>
      <div id="scene-title"></div>
      <button id="auto-rotate-btn" title="自动旋转">⟳</button>
      <div id="thumb-bar"></div>
      <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">正在加载全景场景...</div>
      </div>
      <div id="error"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
